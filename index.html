<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Memorize">
<meta name="theme-color" content="#2f6f5e">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorize</title>
<style>
:root{--bg:#faf8f4;--sf:#fff;--tx:#1f1d1a;--mu:#7a756c;--ac:#2f6f5e;--ac2:#e8f2ee;--bd:#e4dfd5;--hid:#d9d3c6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--sf:#222120;--tx:#efece6;--mu:#9a958b;--ac:#6fc3a9;--ac2:#1f2e29;--bd:#34322e;--hid:#46433d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--sf:#222120;--tx:#efece6;--mu:#9a958b;--ac:#6fc3a9;--ac2:#1f2e29;--bd:#34322e;--hid:#46433d;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--sf)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer;touch-action:manipulation}
button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button:active{opacity:.7}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer}
.card b{display:block}.card small{color:var(--mu)}
.bar{flex:1;height:6px;background:var(--bd);border-radius:3px;max-width:90px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
input[type=text],textarea{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
textarea{min-height:50vh;resize:vertical}
#read{font-size:var(--fs,26px);line-height:1.7;padding:18px 16px 40vh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;white-space:pre-wrap}
#read .l{display:block;min-height:1em;margin-bottom:.55em}
.w.h{color:var(--tx)}
.o{color:var(--mu);font-style:italic}
.mg{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px}.mg h3{margin:0 0 8px;font-size:17px}
.mo{display:flex;justify-content:space-between;padding:14px 12px;border-radius:10px;background:var(--bg);margin-bottom:6px;cursor:pointer}.mo.on{background:var(--ac2);outline:1px solid var(--ac)}.mo span{color:var(--mu)}
.sl{padding:10px 12px;border-radius:10px;margin-bottom:6px;border:1px solid var(--bd);background:var(--sf);color:var(--mu);cursor:pointer;white-space:pre-wrap}
.sl.on{background:var(--ac2);color:var(--tx);border-color:var(--ac)}
.w.t{background:var(--ac2)}
#ft button{transition:transform .08s ease,filter .08s ease,opacity .15s}
#ft button:active{transform:scale(.93);filter:brightness(1.3)}
#ft button.hold{animation:hold .6s linear forwards}
@keyframes hold{0%{transform:scale(.96);filter:brightness(1)}100%{transform:scale(.88);filter:brightness(1.6)}}
#ft button.pulse{animation:pl .45s ease-out}
@keyframes pl{0%{box-shadow:0 0 0 0 var(--ac);transform:scale(.9)}60%{transform:scale(1.04)}100%{box-shadow:0 0 0 16px transparent;transform:scale(1)}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ac);color:var(--bg);padding:8px 16px;border-radius:20px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.w.h .c{border-bottom:2px solid var(--mu)}
.w.h .x{color:transparent}
.w.t .c,#read.all .w.h .c{border-bottom-color:transparent}
.w.t .x,#read.all .w.h .x{color:inherit}
footer{border-top:1px solid var(--bd);background:var(--sf);padding:10px 14px calc(10px)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:760px;margin:0 auto}
.row+.row{margin-top:8px}
input[type=range]{flex:1;min-width:80px;accent-color:var(--ac)}
.pct{min-width:44px;text-align:right;color:var(--mu);font-variant-numeric:tabular-nums}
.sync{font-size:12px;color:var(--mu)}
label.f{display:inline-block}
.hint{color:var(--mu);font-size:13px;margin:6px 0 14px}
.hide{display:none!important}
button,select,header,footer,.card,.mo,.sl{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input[type=text],textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<footer id="ft" class="hide"></footer>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var main=$("#main"),hd=$("#hd"),ft=$("#ft");
var texts={}, cur=null, db=null, uid=null, col=null, saveT=null, lastWrite=0, syncState="local";
var LS="memorize-texts-v1";
var PK="memorize-prefs-v1",prefs={theme:"auto",fs:26,hap:true};
try{var pp=JSON.parse(localStorage.getItem(PK)||"null");if(pp){prefs.theme=pp.theme||"auto";prefs.fs=pp.fs||26;prefs.hap=pp.hap!==false}}catch(e){}
function applyPrefs(){var r=document.documentElement;if(prefs.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",prefs.theme);r.style.setProperty("--fs",prefs.fs+"px")}
function savePrefs(){try{localStorage.setItem(PK,JSON.stringify(prefs))}catch(e){}}
var hapEl=null,toastT=0;
function iosTick(){try{if(!hapEl){var l=document.createElement("label");l.setAttribute("aria-hidden","true");l.style.display="none";l.innerHTML='<input type="checkbox" switch>';document.head.appendChild(l);hapEl=l}hapEl.click()}catch(e){}}
function buzz(kind){
  if(prefs.hap===false)return;
  try{if(navigator.vibrate){navigator.vibrate(kind==="end"?[18,60,30]:12);return}}catch(e){}
  iosTick();if(kind==="end")setTimeout(iosTick,90);
}
function pulse(b){b.classList.remove("pulse");void b.offsetWidth;b.classList.add("pulse")}
function msg(t){var e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=t;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("on")},1100)}
function setFs(v,defer){prefs.fs=Math.max(14,Math.min(56,Math.round(v)));applyPrefs();if(!defer)savePrefs()}
applyPrefs();
function showDisplay(){
  if(document.getElementById("dp"))return;
  var d=document.createElement("div");d.id="dp";
  d.style.cssText="position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center";
  d.innerHTML='<div style="background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))"><div class="row" style="justify-content:space-between"><b style="font-size:18px">Display</b><button id="dx">Done</button></div><p class="hint">Reading text size (you can also pinch the text)</p><div class="row"><span style="font-size:14px">A</span><input type="range" id="fz" min="14" max="56" step="1"><span style="font-size:28px">A</span><span class="pct" id="fv"></span></div><p class="hint">Appearance</p><div class="row" id="tg"><button data-t="auto" style="flex:1">Auto</button><button data-t="light" style="flex:1">Light</button><button data-t="dark" style="flex:1">Dark</button></div><p class="hint">Feedback when you tap Hide / Reveal</p><div class="row" id="hp"><button data-h="1" style="flex:1">Haptics on</button><button data-h="0" style="flex:1">Off</button></div><p class="hint">Saved on this device only, so your iPhone and iPad can each have their own size.</p></div>';
  document.body.appendChild(d);
  var fz=d.querySelector("#fz"),fv=d.querySelector("#fv"),tg=d.querySelector("#tg");
  function paint(){fz.value=prefs.fs;fv.textContent=prefs.fs;Array.prototype.forEach.call(tg.children,function(b){b.className=b.dataset.t===prefs.theme?"p":""});Array.prototype.forEach.call(d.querySelector("#hp").children,function(b){b.className=(b.dataset.h==="1")===(prefs.hap!==false)?"p":""})}
  paint();
  fz.oninput=function(){setFs(+fz.value);fv.textContent=prefs.fs};
  tg.onclick=function(e){var b=e.target.closest("button");if(!b)return;prefs.theme=b.dataset.t;applyPrefs();savePrefs();paint()};
  d.querySelector("#hp").onclick=function(e){var b=e.target.closest("button");if(!b)return;prefs.hap=b.dataset.h==="1";savePrefs();paint();buzz("tap")};
  var close=function(){d.remove()};
  d.querySelector("#dx").onclick=close;d.onclick=function(e){if(e.target===d)close()};
}

/* ---------- storage: localStorage + GitHub sync ---------- */
var GH_KEY="memorize-gh-v1",gh=null,pushT=null,syncing=false;
try{gh=JSON.parse(localStorage.getItem(GH_KEY)||"null")}catch(e){}
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(texts))}catch(e){}}
texts=lsLoad();
function setSync(){var e=$("#sync");if(!e)return;e.textContent=!gh?"Local only":!navigator.onLine?"\u25cb Offline \u2013 saved":({synced:"\u25cf Synced",saving:"\u25cb Saving\u2026",busy:"\u25cb Syncing\u2026",error:"\u26a0 Sync error"}[syncState]||"\u25cf Synced")}
function persist(t){t.updated=Date.now();texts[t.id]=t;lsSave();schedulePush()}
function persistSoon(t){clearTimeout(saveT);saveT=setTimeout(function(){persist(t)},500)}
function remove(id){texts[id]={id:id,deleted:true,updated:Date.now()};lsSave();schedulePush()}
function schedulePush(){if(!gh)return;syncState="saving";setSync();clearTimeout(pushT);pushT=setTimeout(function(){sync()},1500)}
function b64e(s){var b=new TextEncoder().encode(s),r="";for(var i=0;i<b.length;i++)r+=String.fromCharCode(b[i]);return btoa(r)}
function b64d(s){var r=atob(s.replace(/\n/g,"")),b=new Uint8Array(r.length);for(var i=0;i<r.length;i++)b[i]=r.charCodeAt(i);return new TextDecoder().decode(b)}
function api(method,body){return fetch("https://api.github.com/repos/"+gh.repo+"/contents/memorize.json",{method:method,headers:{Authorization:"Bearer "+gh.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined,cache:"no-store"})}
function merge(remote){var ch=false;Object.keys(remote).forEach(function(k){var r=remote[k],l=texts[k];if(!l||(r.updated||0)>(l.updated||0)){texts[k]=r;ch=true}});return ch}
function refreshView(){
  if(cur){var t=texts[cur.id];if(!t||t.deleted){if(!$("#editor"))renderList();return}
    if(t.updated>(cur.updated||0)&&!$("#editor")&&!$("#ll")){cur=t;renderStudy(true)}}
  else if(!$("#editor")&&!$("#gset"))renderList();
}
function sync(tries){
  if(!gh||syncing)return;if(!navigator.onLine){setSync();return}syncing=true;syncState="busy";setSync();tries=tries||0;
  api("GET").then(function(r){
    if(r.status===404)return {sha:null,remote:{}};
    if(!r.ok)throw new Error(r.status);
    return r.json().then(function(j){var d={};try{d=JSON.parse(b64d(j.content))}catch(e){}return {sha:j.sha,remote:d.texts||{}}});
  }).then(function(x){
    var ch=merge(x.remote);
    var need=Object.keys(texts).some(function(k){return !x.remote[k]||texts[k].updated>(x.remote[k].updated||0)});
    var after=function(){syncing=false;syncState="synced";lsSave();setSync();if(ch)refreshView()};
    if(!need){after();return}
    var body={message:"sync",content:b64e(JSON.stringify({texts:texts}))};if(x.sha)body.sha=x.sha;
    return api("PUT",body).then(function(r){
      if(r.status===409||r.status===422){syncing=false;if(tries<2)return sync(tries+1);throw new Error("conflict")}
      if(!r.ok)throw new Error(r.status);after();
    });
  }).catch(function(){syncing=false;syncState="error";setSync()});
}
if(gh){sync();document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});setInterval(function(){sync()},60000)}
window.addEventListener("online",function(){if(gh)sync()});
window.addEventListener("offline",function(){setSync()});
function renderSettings(){
  stopScroll();ft.classList.add("hide");cur=null;
  hd.innerHTML='<button id="bk">\u2039 Back</button><h1>GitHub sync</h1><button class="p" id="sv">Save</button>';
  main.innerHTML='<div class="wrap" id="gset"><button id="dsp" style="margin-bottom:12px">Text size &amp; appearance (light / dark)</button><p class="hint">Your texts are saved as one file (<code>memorize.json</code>) in a <b>private</b> GitHub repo you create. Do this once per device. The token stays on this device only.</p><label class="hint">Data repo (owner/name)</label><input type="text" id="gr" placeholder="yourname/memorize-data" autocapitalize="none" autocorrect="off" value="'+(gh?gh.repo:"")+'"><label class="hint">Fine-grained access token</label><input type="text" id="gt" placeholder="github_pat_\u2026" autocapitalize="none" autocorrect="off" value="'+(gh?gh.token:"")+'"><p class="hint">App version: 2026-11-21-c</p><p class="hint">Create the token at GitHub \u203a Settings \u203a Developer settings \u203a Fine-grained tokens. Give it access to <b>only</b> that one repo, with <b>Contents: Read and write</b>.</p>'+(gh?'<button id="dc">Disconnect this device</button>':"")+'</div>';
  $("#bk").onclick=renderList;
  $("#dsp").onclick=showDisplay;
  $("#sv").onclick=function(){var r=$("#gr").value.trim(),t=$("#gt").value.trim();if(!/^[^\/\s]+\/[^\/\s]+$/.test(r)||!t){alert("Enter the repo as owner/name and paste the token.");return}
    gh={repo:r,token:t};try{localStorage.setItem(GH_KEY,JSON.stringify(gh))}catch(e){}
    syncing=false;sync();renderList()};
  var d=$("#dc");if(d)d.onclick=function(){gh=null;try{localStorage.removeItem(GH_KEY)}catch(e){}renderList()};
}

/* ---------- helpers ---------- */
function uuid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;var t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffled(n,seed){var a=[],i,r=rng(seed);for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){var j=Math.floor(r()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function mask(w,mode){
  if(mode==="initial"){var f=false;return w.replace(/[\p{L}\p{N}]/gu,function(c){if(!f){f=true;return c}return "_"})}
  return w.replace(/[\p{L}\p{N}]/gu,"_");
}
function stripImport(raw,name){
  var t=raw;
  if(/\.(html?|htm)$/i.test(name)){var d=new DOMParser().parseFromString(t,"text/html");t=d.body?d.body.innerText||d.body.textContent:t}
  else if(/\.rtf$/i.test(name)){t=t.replace(/\\par[d]?/g,"\n").replace(/\{\\\*[^}]*\}/g,"").replace(/\\'([0-9a-f]{2})/gi,function(m,h){return String.fromCharCode(parseInt(h,16))}).replace(/\\[a-z]+-?\d* ?/gi,"").replace(/[{}]/g,"")}
  return t.replace(/\r/g,"").trim();
}

/* ---------- library ---------- */
function renderList(){
  cur=null;stopScroll();ft.classList.add("hide");
  hd.innerHTML='<h1>Memorize</h1><span class="sync" id="sync"></span><button id="gs">⚙</button><button class="p" id="new">+ New</button>';$("#gs").onclick=renderSettings;
  setSync();$("#new").onclick=function(){renderEditor(null)};
  var ids=Object.keys(texts).filter(function(k){return !texts[k].deleted}).sort(function(a,b){return(texts[b].updated||0)-(texts[a].updated||0)});
  var h='<div class="wrap">';
  if(!ids.length)h+='<p class="hint">No texts yet. Tap “+ New” to paste or import something to learn. Tap ⚙ to set up GitHub sync between your devices.</p>';
  ids.forEach(function(id){var t=texts[id],p=Math.round((t.level||0)*100);
    h+='<div class="card" data-id="'+id+'"><div style="flex:1;min-width:0"><b>'+esc(t.title||"Untitled")+'</b><small>'+(t.body||"").split(/\s+/).filter(Boolean).length+' words</small></div><div class="bar"><i style="width:'+p+'%"></i></div><small>'+p+'%</small></div>'});
  main.innerHTML=h+'</div>';main.scrollTop=0;
  Array.prototype.forEach.call(main.querySelectorAll(".card"),function(c){c.onclick=function(){cur=texts[c.dataset.id];renderMethod(true)}});
}

/* ---------- editor / import ---------- */
function renderEditor(t){
  stopScroll();ft.classList.add("hide");
  hd.innerHTML='<button id="bk">‹ Back</button><h1>'+(t?"Edit text":"New text")+'</h1><button class="p" id="sv">Save</button>'+(t?'<button id="del">Delete</button>':"");
  main.innerHTML='<div class="wrap" id="editor"><input type="text" id="ti" placeholder="Title" value="'+(t?esc(t.title).replace(/"/g,"&quot;"):"")+'"><textarea id="bd" placeholder="Paste or type your text. Line breaks are kept."></textarea><label class="f"><button onclick="this.nextElementSibling.click()">Import .txt / .html / .rtf</button><input type="file" id="fi" accept=".txt,.html,.htm,.rtf,text/*" class="hide"></label><p class="hint">PDFs: open the PDF, select all, copy, and paste here. Start a line with /// to leave it out of your study (it stays visible as a cue).</p></div>';
  $("#bd").value=t?t.body:"";
  $("#bk").onclick=function(){t?renderStudy():renderList()};
  $("#fi").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("#bd").value=stripImport(String(r.result),f.name);if(!$("#ti").value)$("#ti").value=f.name.replace(/\.[^.]+$/,"")};r.readAsText(f)};
  $("#sv").onclick=function(){
    var body=$("#bd").value.replace(/\r/g,"").trim(),offM=[];if(!body)return;
    body=body.split("\n").map(function(l,i){if(/^\s*\/\/\//.test(l)){offM.push(i);return l.replace(/^\s*\/\/\/\s?/,"")}return l}).join("\n");
    var n=t||{id:uuid(),level:0,mode:"except-last",seed:Math.floor(Math.random()*1e9),speed:30};
    n.title=$("#ti").value.trim()||body.split("\n")[0].slice(0,40);
    if(t&&t.body!==body){n.seed=Math.floor(Math.random()*1e9)}
    if(offM.length)n.off=offM;else if(!t||t.body!==body)n.off=[];
    n.body=body;persist(n);cur=n;if(t)renderStudy();else renderMethod();
  };
  var d=$("#del");if(d)d.onclick=function(){if(confirm("Delete this text on all devices?")){remove(t.id);renderList()}};
}

/* ---------- study view ---------- */
var METHODS=[
 ["Hide words except first letter","First letter",[["except-last","Starting with the last word","last word"],["except-first","Starting with the first word","first word"],["except-random","Randomly","random"]]],
 ["Hide entire words","Words",[["words-last","Starting with the last word","last word"],["words-first","Starting with the first word","first word"],["words-random","Randomly","random"]]],
 ["Show first words of each paragraph","First words",[["para3","Show 3 words","3 words"],["para2","Show 2 words","2 words"],["para1","Show 1 word","1 word"]]],
 ["Hide entire sentences","Sentences",[["sent-last","Starting with the last sentence","last sentence"],["sent-first","Starting with the first sentence","first sentence"],["sent-random","Randomly","random"]]]
];
function modeLabel(m){m=normMode(m);for(var i=0;i<METHODS.length;i++)for(var j=0;j<METHODS[i][2].length;j++)if(METHODS[i][2][j][0]===m)return METHODS[i][1]+" \u00b7 "+METHODS[i][2][j][2];return "Method"}
function renderMethod(first){
  stopScroll();ft.classList.add("hide");
  hd.innerHTML='<button id="bk">\u2039 Back</button><h1>Pick a method</h1>';
  var h='<div class="wrap">'+(first?'<button class="p" id="go" style="width:100%;padding:15px;margin-bottom:12px">Continue with '+esc(modeLabel(cur.mode))+'</button>':'');
  METHODS.forEach(function(g){h+='<div class="mg"><h3>'+g[0]+'</h3>';g[2].forEach(function(o){h+='<div class="mo'+(normMode(cur.mode)===o[0]?" on":"")+'" data-m="'+o[0]+'">'+o[1]+'<span>\u203a</span></div>'});h+='</div>'});
  main.innerHTML=h+'</div>';main.scrollTop=0;
  $("#bk").onclick=function(){first?renderList():renderStudy()};
  var go=$("#go");if(go)go.onclick=function(){renderStudy()};
  main.firstChild.onclick=function(e){var o=e.target.closest(".mo");if(!o)return;cur.mode=o.dataset.m;persist(cur);renderStudy()};
}
function renderSelect(){
  stopScroll();ft.classList.add("hide");
  var lines=cur.body.split("\n"),off={},sel={};
  (cur.off||[]).forEach(function(i){off[i]=1});
  lines.forEach(function(l,i){if(l.trim()&&!off[i])sel[i]=1});
  hd.innerHTML='<button id="bk">Cancel</button><h1>Select lines to study</h1><button class="p" id="sv">Done</button>';
  main.innerHTML='<div class="wrap"><div class="row" style="margin-bottom:8px"><button id="sa">Select all</button><button id="da">Deselect all</button></div><div class="row" style="margin-bottom:6px"><input type="text" id="nm" placeholder="Your character’s name (e.g. MAGGIE)" style="flex:1;margin:0"><button id="au">Auto-select</button></div><p class="hint">Auto-select picks lines that start with your name (“MAGGIE: …”) or that follow a line containing only your name, until the next blank line. Tap any line to toggle it. Unselected lines stay visible as cues.</p><div id="ll"></div></div>';
  function paint(){var h="";lines.forEach(function(l,i){if(!l.trim()){h+='<div style="height:10px"></div>';return}h+='<div class="sl'+(sel[i]?" on":"")+'" data-i="'+i+'">'+esc(l)+'</div>'});$("#ll").innerHTML=h}
  paint();main.scrollTop=0;
  $("#ll").onclick=function(e){var d=e.target.closest(".sl");if(!d)return;var i=d.dataset.i;if(sel[i])delete sel[i];else sel[i]=1;d.classList.toggle("on")};
  $("#sa").onclick=function(){lines.forEach(function(l,i){if(l.trim())sel[i]=1});paint()};
  $("#da").onclick=function(){sel={};paint()};
  $("#au").onclick=function(){
    var nm=$("#nm").value.trim().toLowerCase();if(!nm)return;
    sel={};var follow=false;
    lines.forEach(function(l,i){var t=l.trim().toLowerCase();
      if(!t){follow=false;return}
      if(t.replace(/[:.\-–\s]+$/,"")===nm){follow=true;return}
      if(t.indexOf(nm)===0&&/^[:.\-–\s]/.test(t.slice(nm.length))){sel[i]=1;follow=false;return}
      if(follow)sel[i]=1;
    });paint();
  };
  $("#bk").onclick=function(){renderStudy()};
  $("#sv").onclick=function(){cur.off=[];lines.forEach(function(l,i){if(l.trim()&&!sel[i])cur.off.push(i)});persist(cur);renderStudy()};
}
var maxK=0,scrollOn=false,raf=0,lastTs=0,acc=0;
function stopScroll(){scrollOn=false;cancelAnimationFrame(raf);var b=$("#play");if(b)b.textContent="▶ Scroll"}
function tick(ts){
  if(!scrollOn)return;
  if(lastTs){acc+=(ts-lastTs)/1000*cur.speed;var px=Math.floor(acc);if(px>=1){main.scrollTop+=px;acc-=px}}
  lastTs=ts;raf=requestAnimationFrame(tick);
}
function normMode(m){return({blank:"words-random",initial:"except-random",lines:"sent-last"})[m]||m||"words-random"}
function build(){
  cur.mode=normMode(cur.mode);
  var lines=cur.body.split("\n"),words=[],lineInfo=[],offSet={};
  (cur.off||[]).forEach(function(i){offSet[i]=1});
  lines.forEach(function(ln,li){var ws=offSet[li]?[]:(ln.match(/\S+/g)||[]);lineInfo.push({ws:ws,start:words.length});ws.forEach(function(w){words.push({w:w,l:li,skip:!/[\p{L}\p{N}]/u.test(w)})})});
  var hiddenW={},hiddenL={},n=words.length,m=cur.mode,i,j,tot=0,mx=0;
  var hb0=lines.some(function(x,q){return !x.trim()&&q>0&&q<lines.length-1}),pd0=0,pb0=true,lp0=[],pw={},pl={};
  lines.forEach(function(ln){if(!ln.trim()){pb0=true;lp0.push(-1);return}if(pb0)pd0++;pb0=false;lp0.push(pd0)});
  // Units for Hide/Reveal = sentences (split at . ! ? ...) and never across a blank line.
  // If the text has hardly any punctuation (lyrics, verse), each line is its own unit.
  var nl=0,tl=0;lines.forEach(function(ln,q){var t=ln.trim();if(!t||offSet[q])return;nl++;if(/[.!?\u2026]["'\u201d\u2019)\]]*$/.test(t))tl++});
  var lineMode=nl>2&&tl/nl<0.25,cg=null,pEnd=true,pPar=-1,pLine=-1,sn=0,ABBR=/^(mr|mrs|ms|dr|st|jr|sr|vs|prof)\.$/i;
  var sg={},pgp={},plg={};
  words.forEach(function(w,q){var p=lp0[w.l];
    if(pEnd||p!==pPar||(lineMode&&w.l!==pLine)){cg=sg[sn++]=[]}
    if(!w.skip){cg.push(q);(pgp[p]=pgp[p]||[]).push(q);(plg[w.l]=plg[w.l]||[]).push(q)}
    pEnd=/[.!?\u2026]["'\u201d\u2019)\]]*$/.test(w.w)&&!ABBR.test(w.w);pPar=p;pLine=w.l;
  });
  [sg,pgp,plg].forEach(function(o){Object.keys(o).forEach(function(k){if(!o[k].length)delete o[k]})});
  var un=cur.unit||"line";pw=un==="sent"?sg:un==="para"?pgp:plg;
  if(cur.k==null){var lg=0;Object.keys(pw).forEach(function(p){lg=Math.max(lg,pw[p].length)});cur.k=Math.round((cur.level||0)*lg)}
  cur.k=Math.max(0,cur.k|0);
  var hc=0,rk=shuffled(n,cur.seed),pos={};
  rk.forEach(function(w,r){pos[w]=r});
  if(/^sent/.test(m)){
    var dr=m.split("-")[1],byP={};
    Object.keys(sg).forEach(function(g){var pp=un==="line"?words[sg[g][0]].l:lp0[words[sg[g][0]].l];(byP[pp]=byP[pp]||[]).push(sg[g])});
    Object.keys(byP).forEach(function(pp){
      var a=byP[pp].slice();
      if(dr==="last")a.reverse();else if(dr==="random")a.sort(function(x,y){return pos[x[0]]-pos[y[0]]});
      var c=Math.min(cur.k,a.length);tot+=a.length;mx=Math.max(mx,a.length);hc+=c;
      for(i=0;i<c;i++)a[i].forEach(function(q){hiddenW[q]=1});
    });
  }else if(/^para/.test(m)){
    var keep=+m.slice(4);
    Object.keys(pw).forEach(function(g){
      var h=pw[g].slice(keep),c=Math.min(cur.k,h.length);tot+=h.length;mx=Math.max(mx,h.length);hc+=c;
      for(j=0;j<c;j++)hiddenW[h[h.length-1-j]]=1;
    });
  }else{
    var dir=m.split("-")[1];
    Object.keys(pw).forEach(function(g){
      var a=pw[g].slice();
      if(dir==="last")a.reverse();else if(dir==="random")a.sort(function(x,y){return pos[x]-pos[y]});
      var c=Math.min(cur.k,a.length);tot+=a.length;mx=Math.max(mx,a.length);hc+=c;
      for(j=0;j<c;j++)hiddenW[a[j]]=1;
    });
  }
  maxK=mx;cur.level=tot?hc/tot:0;
  var h="",idx=0;
  lines.forEach(function(ln,li){
    var parts=ln.split(/(\s+)/),out="";
    parts.forEach(function(p){
      if(!p)return;
      if(/^\s+$/.test(p)){out+=p;return}
      if(offSet[li]){out+='<span class="o">'+esc(p)+'</span>';return}
      var hid=hiddenW[idx];
      var mm=p.match(/^([^\p{L}\p{N}'\u2019]*)([\s\S]*?)([^\p{L}\p{N}'\u2019]*)$/u),pre=mm[1],core=mm[2],post=mm[3],inner;
      if(hid&&/^except/.test(cur.mode)){var cp=Array.from(core);inner='<span class="v">'+esc(cp[0])+'</span><span class="x">'+esc(cp.slice(1).join(""))+'</span>'}
      else if(hid)inner='<span class="x">'+esc(core)+'</span>';
      else inner=esc(core);
      out+='<span class="w'+(hid?" h":"")+'" data-i="'+idx+'">'+esc(pre)+'<span class="c">'+inner+'</span>'+esc(post)+'</span>';
      idx++;
    });
    h+='<span class="l">'+out+'</span>';
  });
  return h;
}
function renderStudy(keep){
  if(!cur)return;
  var top=keep?main.scrollTop:0;
  hd.innerHTML='<button id="bk">‹</button><h1>'+esc(cur.title||"")+'</h1><button id="gb" aria-label="Settings">\u2699</button>';
  ft.classList.remove("hide");
  ft.innerHTML='<div class="row"><button id="rev" style="flex:1;padding:15px">\u2212 Reveal</button><button id="hide" class="p" style="flex:1;padding:15px">+ Hide</button></div>';
  main.innerHTML='<div id="read"></div>';
  var rd=$("#read");draw();main.scrollTop=top;setSync();
  $("#bk").onclick=renderList;$("#gb").onclick=openSheet;
  function setK(v){cur.k=Math.max(0,Math.min(maxK,Math.round(v)));draw();persistSoon(cur)}
  function draw(){var s=main.scrollTop;rd.innerHTML=build();main.scrollTop=s;var rv0=$("#rev");if(rv0)rv0.style.opacity=cur.k<=0?".4":"1";var lv=$("#lv");if(lv){lv.max=Math.max(maxK,1);lv.value=Math.min(cur.k,maxK);$("#pc").textContent=Math.min(cur.k,maxK)+"/"+maxK}}
  var step=function(){var n=(cur.body.match(/\S+/g)||[]).length;return Math.max(0.03,Math.min(0.15,3/Math.max(n,1)*2))};
  // Hide / Reveal: tap = one step, hold = all. Each gives a press ring, a haptic tick, and a distinct "all done" pulse.
  function wire(btn,dir){
    var tm,lg=false;
    btn.onpointerdown=function(){lg=false;btn.classList.add("hold");tm=setTimeout(function(){lg=true;btn.classList.remove("hold");setK(dir>0?maxK:0);buzz("end");pulse(btn);msg(dir>0?"All words hidden":"All words revealed")},600)};
    var cancel=function(){clearTimeout(tm);btn.classList.remove("hold")};
    btn.onpointerup=btn.onpointerleave=btn.onpointercancel=cancel;
    btn.onclick=function(){
      if(lg){lg=false;buzz("end");return}
      setK(cur.k+dir*(cur.step||1));
      if(dir>0?cur.k>=maxK:cur.k<=0){buzz("end");pulse(btn);msg(dir>0?"All words hidden":"All words revealed")}else buzz("tap");
    };
  }
  wire($("#hide"),1);wire($("#rev"),-1);
  function openSheet(){
    if($("#sh"))return;
    var d=document.createElement("div");d.id="sh";
    d.style.cssText="position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center";
    d.innerHTML='<div style="background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))">'+
    '<div class="row" style="justify-content:space-between;margin-bottom:10px"><b style="font-size:18px">Settings</b><button id="sx">Done</button></div>'+
    '<button id="md" style="width:100%;text-align:left;margin-bottom:12px">Method: '+esc(modeLabel(cur.mode))+' \u203a</button>'+
    '<p class="hint" style="margin:0 0 4px">Hide progress</p><div class="row"><input type="range" id="lv" min="0" max="1" value="0"><span class="pct" id="pc" style="min-width:60px"></span></div>'+
    '<div class="row" style="margin:12px 0"><span style="flex:1">Words per Hide / Reveal tap</span><select id="st"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>'+
    '<div class="row" style="margin:0 0 12px"><span style="flex:1">Start hiding from the end of each</span><select id="un"><option value="line">line (new line = new paragraph)</option><option value="para">block (blank-line separated)</option><option value="sent">sentence</option></select></div>'+
    '<div class="row" style="margin-bottom:12px"><button id="play">'+(scrollOn?"\u275a\u275a Stop scroll":"\u25b6 Autoscroll")+'</button><input type="range" id="sp" min="5" max="150" value="'+cur.speed+'"></div>'+
    '<div class="row"><button id="shuf" style="flex:1">\u27f3 Reshuffle random words</button></div>'+
    '<div class="row" style="margin-top:12px"><button id="ln" style="flex:1">Select lines</button><button id="ed" style="flex:1">Edit text</button></div>'+
    '<div class="row" style="margin-top:8px"><button id="aa" style="flex:1">Text size &amp; light / dark</button></div></div>';
    document.body.appendChild(d);
    var q=function(x){return d.querySelector(x)},close=function(){d.remove()};
    d.onclick=function(e){if(e.target===d)close()};
    q("#sx").onclick=close;
    q("#md").onclick=function(){close();renderMethod()};
    q("#ln").onclick=function(){close();renderSelect()};
    q("#ed").onclick=function(){close();renderEditor(cur)};
    q("#aa").onclick=showDisplay;
    q("#st").value=String(cur.step||1);q("#st").onchange=function(e){cur.step=+e.target.value;persistSoon(cur)};
    q("#un").value=cur.unit||"line";q("#un").onchange=function(e){cur.unit=e.target.value;draw();persistSoon(cur)};
    q("#lv").oninput=function(e){setK(+e.target.value)};
    q("#shuf").onclick=function(){cur.seed=Math.floor(Math.random()*1e9);draw();persistSoon(cur)};
    q("#sp").oninput=function(e){cur.speed=+e.target.value;persistSoon(cur)};
    q("#play").onclick=function(){close();if(scrollOn){stopScroll();return}scrollOn=true;lastTs=0;acc=0;raf=requestAnimationFrame(tick)};
    draw();
  }
  main.addEventListener("touchstart",function(){if(scrollOn)stopScroll()},{passive:true});
  // hold on text: temporarily reveal everything; tap a word: peek at it
  var ht;
  rd.onpointerdown=function(){ht=setTimeout(function(){rd.classList.add("all")},350)};
  var up=function(){clearTimeout(ht);if(rd.classList.contains("all")){rd.classList.remove("all");var sc=main.scrollTop;draw();main.scrollTop=sc}};
  rd.onpointerup=rd.onpointerleave=rd.onpointercancel=up;
  rd.oncontextmenu=function(e){e.preventDefault()};
  var pd=0,pf=0,td=function(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
  rd.addEventListener("touchstart",function(e){if(e.touches.length===2){clearTimeout(ht);pd=td(e);pf=prefs.fs}},{passive:true});
  rd.addEventListener("touchmove",function(e){if(e.touches.length===2&&pd){e.preventDefault();setFs(pf*td(e)/pd,true)}},{passive:false});
  rd.addEventListener("touchend",function(){if(pd){pd=0;savePrefs()}});
  rd.onclick=function(e){var s=e.target.closest(".w.h");if(s)s.classList.add("t")};
}
ft.oncontextmenu=hd.oncontextmenu=function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()};
renderList();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(function(){});
})();
